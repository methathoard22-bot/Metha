<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR เตาอบ - Hiro Marker</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #111; }
    a-scene { position: fixed; inset: 0; }
    .panel {
      position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 12px;
      padding: 14px; border-radius: 18px; color: #fff;
      background: rgba(20, 25, 33, .91); backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0,0,0,.35); max-width: 560px; margin: auto;
    }
    .heading { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom: 10px; }
    h1 { font-size: 18px; margin: 0; }
    #status { font-size: 12px; color: #ffd166; }
    .control { margin: 10px 0; }
    .line { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-size:14px; }
    input[type=range] { width:100%; accent-color:#ff9f1c; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
    button { border:0; border-radius:12px; padding:12px 10px; color:#171717; font-weight:700; font-size:14px; background:#ffd166; cursor:pointer; }
    button.secondary { background:#d9e2ec; }
    .hint { font-size:11px; color:#c4ccd5; margin-top:9px; line-height:1.45; }
    @media (min-width:600px) { .panel { left:auto; right:18px; bottom:18px; width:340px; } }
  </style>
</head>
<body>
  <a-scene embedded renderer="colorManagement: true; physicallyCorrectLights: true"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
    <a-assets>
      <a-mixin id="metal" material="color: #687582; metalness: .72; roughness: .28"></a-mixin>
    </a-assets>

    <!-- เปลี่ยนโมเดลทั้งหมดให้อยู่ภายใน marker Hiro -->
    <a-marker preset="hiro" id="hiroMarker">
      <a-entity id="oven" position="0 0 0" scale="1 1 1">
        <!-- ตัวเตาอบ -->
        <a-box position="0 0.72 0" width="1.45" height="1.05" depth="0.92"
               material="color:#303944; metalness:.55; roughness:.35"></a-box>
        <!-- ขอบหน้าตู้ -->
        <a-box position="0 0.72 0.475" width="1.28" height="0.82" depth="0.045"
               material="color:#171d25; metalness:.25; roughness:.3"></a-box>
        <!-- ช่องกระจกประตู -->
        <a-box position="0 0.75 0.505" width="1.08" height="0.59" depth="0.025"
               material="color:#172c3d; opacity:.78; transparent:true; metalness:.35; roughness:.15"></a-box>
        <!-- ชั้นภายใน -->
        <a-box position="0 0.62 0.35" width=".9" height=".025" depth=".18"
               material="color:#aab4bd; metalness:.8; roughness:.3"></a-box>
        <!-- แผงควบคุมด้านบน -->
        <a-box position="0 1.32 0.48" width="1.3" height=".19" depth=".08"
               material="color:#151a20; metalness:.25"></a-box>
        <!-- ปุ่มหมุนจำลอง -->
        <a-cylinder position="-.42 1.32 .54" rotation="90 0 0" radius=".065" height=".045"
                    material="color:#e5a83b; metalness:.4"></a-cylinder>
        <a-cylinder position=".42 1.32 .54" rotation="90 0 0" radius=".065" height=".045"
                    material="color:#e5a83b; metalness:.4"></a-cylinder>
        <!-- มือจับประตู -->
        <a-box position="0 1.05 .56" width=".48" height=".045" depth=".055"
               material="color:#d7dde2; metalness:.85; roughness:.2"></a-box>
        <!-- ขาตั้ง -->
        <a-box position="-.52 .12 -.28" width=".13" height=".24" depth=".13" material="color:#202832"></a-box>
        <a-box position=".52 .12 -.28" width=".13" height=".24" depth=".13" material="color:#202832"></a-box>
        <a-box position="-.52 .12 .28" width=".13" height=".24" depth=".13" material="color:#202832"></a-box>
        <a-box position=".52 .12 .28" width=".13" height=".24" depth=".13" material="color:#202832"></a-box>

        <!-- ประตูหมุนเปิดลง โดยหมุนรอบบานพับด้านล่าง -->
        <a-entity id="doorPivot" position="0 .20 .49">
          <a-box id="ovenDoor" position="0 .52 .035" width="1.25" height=".78" depth=".07"
                 material="color:#263746; opacity:.88; transparent:true; metalness:.4; roughness:.18"></a-box>
          <a-box position="0 .91 .075" width=".5" height=".045" depth=".06"
                 material="color:#d7dde2; metalness:.85"></a-box>
        </a-entity>
        <a-text value="SMART OVEN" position="0 1.48 .50" align="center" color="#ffffff" width="2.7"></a-text>
        <!-- แสงไฟด้านใน -->
        <a-box position="-.48 .77 .39" width=".035" height=".035" depth=".025"
               material="color:#ffcf70; emissive:#ff9f1c; emissiveIntensity:1.5"></a-box>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <section class="panel" aria-label="แผงควบคุมเตาอบ">
    <div class="heading">
      <h1>🍞 แผงควบคุมเตาอบ AR</h1>
      <span id="status">กำลังค้นหา Hiro...</span>
    </div>
    <div class="control">
      <div class="line"><label for="temperature">อุณหภูมิ</label><strong><span id="tempValue">180</span> °C</strong></div>
      <input id="temperature" type="range" min="50" max="250" step="5" value="180">
    </div>
    <div class="control">
      <div class="line"><label for="minutes">ตั้งเวลา</label><strong><span id="timeValue">20</span> นาที</strong></div>
      <input id="minutes" type="range" min="1" max="120" step="1" value="20">
    </div>
    <div class="buttons">
      <button id="doorButton">เปิดฝาเตาอบ</button>
      <button id="powerButton" class="secondary">เริ่มทำงาน</button>
    </div>
    <div class="hint">วางภาพ Marker “Hiro” ไว้หน้ากล้องเพื่อแสดงเตาอบ 3 มิติ • ต้องอนุญาตให้เว็บไซต์ใช้กล้อง</div>
  </section>

  <script>
    const marker = document.querySelector('#hiroMarker');
    const statusText = document.querySelector('#status');
    const temp = document.querySelector('#temperature');
    const minutes = document.querySelector('#minutes');
    const tempValue = document.querySelector('#tempValue');
    const timeValue = document.querySelector('#timeValue');
    const doorPivot = document.querySelector('#doorPivot');
    const doorButton = document.querySelector('#doorButton');
    const powerButton = document.querySelector('#powerButton');

    let doorOpen = false;
    let running = false;
    let timerId = null;
    let remaining = Number(minutes.value) * 60;

    marker.addEventListener('markerFound', () => statusText.textContent = 'พบ Hiro แล้ว ✓');
    marker.addEventListener('markerLost', () => statusText.textContent = 'ไม่พบ Marker Hiro');

    temp.addEventListener('input', () => tempValue.textContent = temp.value);
    minutes.addEventListener('input', () => {
      timeValue.textContent = minutes.value;
      if (!running) remaining = Number(minutes.value) * 60;
    });

    doorButton.addEventListener('click', () => {
      doorOpen = !doorOpen;
      doorPivot.setAttribute('animation', {
        property: 'rotation.x',
        to: doorOpen ? -85 : 0,
        dur: 500,
        easing: 'easeInOutSine'
      });
      doorButton.textContent = doorOpen ? 'ปิดฝาเตาอบ' : 'เปิดฝาเตาอบ';
    });

    function stopOven() {
      running = false;
      clearInterval(timerId);
      timerId = null;
      powerButton.textContent = 'เริ่มทำงาน';
      powerButton.classList.add('secondary');
    }

    powerButton.addEventListener('click', () => {
      if (running) {
        stopOven();
        return;
      }
      if (doorOpen) {
        alert('กรุณาปิดฝาเตาอบก่อนเริ่มทำงาน');
        return;
      }
      remaining = Number(minutes.value) * 60;
      running = true;
      powerButton.textContent = 'หยุดการทำงาน';
      powerButton.classList.remove('secondary');
      timerId = setInterval(() => {
        remaining--;
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        powerButton.textContent = `หยุด (${mins}:${String(secs).padStart(2, '0')})`;
        if (remaining <= 0) {
          stopOven();
          alert('หมดเวลาอบแล้ว!');
        }
      }, 1000);
    });
  </script>
</body>
</html>
