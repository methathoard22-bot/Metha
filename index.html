<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AR Hiro - Oven</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans Thai",sans-serif}
#status{
 position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);
 background:rgba(0,0,0,.72);color:#fff;padding:9px 15px;border-radius:14px;
 font-size:14px;text-align:center;white-space:nowrap
}
#panel{
 position:fixed;z-index:20;bottom:15px;left:50%;transform:translateX(-50%);
 width:min(94vw,520px);padding:12px;border-radius:18px;
 background:rgba(15,15,18,.88);color:white;box-shadow:0 6px 25px #0008;
}
.row{display:flex;align-items:center;justify-content:center;gap:8px;margin:7px 0}
button{
 border:0;border-radius:12px;padding:11px 15px;font-size:16px;font-weight:700;
 color:#fff;background:#455a64;min-width:54px
}
button:active{transform:scale(.95)}
.value{min-width:135px;text-align:center;background:#212121;padding:10px;border-radius:10px}
#power{background:#c62828}
#power.on{background:#2e7d32}
</style>
</head>

<body>
<div id="status">กำลังเปิดกล้อง… หันกล้องไปที่ Marker Hiro</div>

<div id="panel">
  <div class="row">
    <button id="heatMinus">−</button>
    <div class="value" id="heatValue">ความร้อน 180°C</div>
    <button id="heatPlus">+</button>
  </div>

  <div class="row">
    <button id="timeMinus">−</button>
    <div class="value" id="timeValue">เวลา 30 นาที</div>
    <button id="timePlus">+</button>
  </div>

  <div class="row">
    <button id="power">เปิดเตาอบ</button>
    <button id="reset">รีเซ็ต</button>
  </div>
</div>

<a-scene embedded vr-mode-ui="enabled:false"
 renderer="colorManagement:true; physicallyCorrectLights:true"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; matrixCodeType:3x3;"
 loading-screen="enabled:false">

  <a-entity light="type:ambient;intensity:1.2"></a-entity>
  <a-entity light="type:directional;intensity:1.6" position="2 4 3"></a-entity>

  <a-marker id="hiro" preset="hiro" emitevents="true">

    <a-entity id="oven" position="0 0 0">

      <!-- ตัวเตาอบ -->
      <a-box position="0 0.72 0" width="1.45" height="1.35" depth="0.90"
             color="#263238"
             material="roughness:.3;metalness:.55"></a-box>

      <!-- ขอบด้านบน -->
      <a-box position="0 1.40 0" width="1.48" height=".12" depth=".93"
             color="#455a64"></a-box>

      <!-- แผงควบคุม -->
      <a-box position="0 1.18 .47" width="1.30" height=".30" depth=".06"
             color="#111"></a-box>

      <!-- จอแสดงผล -->
      <a-box position="0 1.22 .515" width=".48" height=".13" depth=".02"
             color="#00bcd4"></a-box>
      <a-text id="display" value="180C 30m" position="0 1.22 .535"
              align="center" width="1.7" color="#e0f7fa"></a-text>

      <!-- ประตูเตา -->
      <a-box position="0 .68 .47" width="1.12" height=".78" depth=".07"
             color="#37474f"></a-box>
      <a-box position="0 .68 .515" width="1.00" height=".65" depth=".025"
             color="#101820"
             material="opacity:.78;transparent:true;roughness:.08"></a-box>

      <!-- มือจับ -->
      <a-box position="0 1.08 .57" width=".72" height=".07" depth=".07"
             color="#90a4ae"></a-box>

      <!-- ถาด/ชั้นใน -->
      <a-box position="0 .42 .20" width=".90" height=".04" depth=".42"
             color="#78909c"></a-box>

      <!-- อาหาร/ถาด -->
      <a-cylinder position="0 .48 .25" radius=".28" height=".035"
                   color="#8d6e63"></a-cylinder>

      <!-- ไฟความร้อน -->
      <a-entity id="heatGlow" visible="false">
        <a-box position="0 .72 .43" width=".75" height=".04" depth=".025"
               color="#ff5722"
               material="emissive:#ff5722;emissiveIntensity:2"></a-box>
      </a-entity>

      <!-- ขา -->
      <a-cylinder position="-.55 .05 .30" radius=".08" height=".10" color="#111"></a-cylinder>
      <a-cylinder position=".55 .05 .30" radius=".08" height=".10" color="#111"></a-cylinder>
      <a-cylinder position="-.55 .05 -.30" radius=".08" height=".10" color="#111"></a-cylinder>
      <a-cylinder position=".55 .05 -.30" radius=".08" height=".10" color="#111"></a-cylinder>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
(() => {
  const marker = document.querySelector('#hiro');
  const display = document.querySelector('#display');
  const heatGlow = document.querySelector('#heatGlow');
  const status = document.querySelector('#status');
  const powerBtn = document.querySelector('#power');

  let temperature = 180;
  let minutes = 30;
  let powerOn = false;

  function updateDisplay(){
    display.setAttribute('value', `${temperature}C ${minutes}m`);
    document.querySelector('#heatValue').textContent = `ความร้อน ${temperature}°C`;
    document.querySelector('#timeValue').textContent = `เวลา ${minutes} นาที`;
  }

  function updatePower(){
    heatGlow.setAttribute('visible', powerOn);
    powerBtn.textContent = powerOn ? 'ปิดเตาอบ' : 'เปิดเตาอบ';
    powerBtn.classList.toggle('on', powerOn);
  }

  document.querySelector('#heatPlus').onclick = () => {
    temperature = Math.min(300, temperature + 10);
    updateDisplay();
  };

  document.querySelector('#heatMinus').onclick = () => {
    temperature = Math.max(50, temperature - 10);
    updateDisplay();
  };

  document.querySelector('#timePlus').onclick = () => {
    minutes = Math.min(180, minutes + 5);
    updateDisplay();
  };

  document.querySelector('#timeMinus').onclick = () => {
    minutes = Math.max(0, minutes - 5);
    updateDisplay();
  };

  powerBtn.onclick = () => {
    powerOn = !powerOn;
    updatePower();
  };

  document.querySelector('#reset').onclick = () => {
    temperature = 180;
    minutes = 30;
    powerOn = false;
    updateDisplay();
    updatePower();
  };

  marker.addEventListener('markerFound', () => {
    status.textContent = 'พบ Marker Hiro ✓  เตาอบพร้อมใช้งาน';
    status.style.background = 'rgba(0,110,70,.85)';
  });

  marker.addEventListener('markerLost', () => {
    status.textContent = 'ไม่พบ Marker Hiro — หันกล้องไปที่ Marker';
    status.style.background = 'rgba(0,0,0,.72)';
  });

  updateDisplay();
  updatePower();
})();
</script>
</body>
</html>
